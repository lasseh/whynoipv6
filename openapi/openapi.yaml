    ResourceLink:
      type: object
      required: [host, aaaa_status, source, required, first_seen, last_seen, last_checked_at]
      properties:
        host: { type: string, example: fonts.googleapis.com }
        aaaa_status:
          allOf: [{ $ref: "#/components/schemas/IPv6Status" }]
          nullable: true
        source: { type: string, enum: [discovered, manual] }
        required: { type: boolean }
        first_seen: { type: string, format: date }
        last_seen: { type: string, format: date }
        last_checked_at: { type: string, format: date-time, nullable: true }
    ResourceLinkList:
      type: object
      required: [items, page, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResourceLink" }
        page: { $ref: "#/components/schemas/Page" }
        meta: { $ref: "#/components/schemas/Meta" }
    ResourceHost:
      type: object
      required: [host, aaaa_status, dependent_count, last_checked_at]
      properties:
        host: { type: string }
        aaaa_status:
          allOf: [{ $ref: "#/components/schemas/IPv6Status" }]
          nullable: true
        dependent_count: { type: integer }
        last_checked_at: { type: string, format: date-time, nullable: true }
    ResourceHostDetail:
      allOf:
        - $ref: "#/components/schemas/ResourceHost"
        - type: object
          required: [meta]
          properties:
            meta: { $ref: "#/components/schemas/DetailMeta" }
    Dependent:
      allOf:
        - $ref: "#/components/schemas/DomainSummary"
        - type: object
          required: [source, required]
          properties:
            source: { type: string, enum: [discovered, manual] }
            required: { type: boolean }
    DependentsResponse:
      type: object
      required: [resource, items, page, meta]
      properties:
        resource: { $ref: "#/components/schemas/ResourceHost" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Dependent" }
        page: { $ref: "#/components/schemas/Page" }
        meta: { $ref: "#/components/schemas/Meta" }

    CheckAccepted:
      type: object
      description: Exactly these four keys on a 202.
      required: [id, host, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        host: { type: string }
        status: { type: string, enum: [pending] }
        created_at: { type: string, format: date-time }
    CheckConfirmed:
      type: object
      required: [classification, class_flags, saint, status, as_of]
      properties:
        classification: { $ref: "#/components/schemas/Classification" }
        class_flags:
          type: array
          items: { $ref: "#/components/schemas/ClassFlag" }
        saint: { type: boolean }
        status: { $ref: "#/components/schemas/StatusBlock" }
        as_of: { type: string, format: date-time, nullable: true }
    CheckEnvelope:
      type: object
      description: >
        The §5.1.2 job body. `id` is null only on the domain-side dedupe
        envelope. `result` statuses are raw observations (incl.
        `inconsistent` on base/www), explicitly NOT confirmed state.
      required: [id, host, status, cached, created_at, completed_at, error, result, confirmed]
      properties:
        id: { type: integer, format: int64, nullable: true }
        host: { type: string }
        status: { type: string, enum: [pending, processing, done, failed] }
        cached: { type: boolean }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        result:
          type: object
          nullable: true
          additionalProperties: true
          properties:
            checked_at: { type: string, format: date-time }
            duration_ms: { type: integer, format: int64 }
            checks:
              type: object
              additionalProperties:
                type: object
                properties:
                  status: { type: string }
            latency:
              type: object
              properties:
                v4_ms: { type: integer, nullable: true }
                v6_ms: { type: integer, nullable: true }
        confirmed:
          allOf: [{ $ref: "#/components/schemas/CheckConfirmed" }]
          nullable: true

    ShieldsBadge:
      type: object
      description: shields.io endpoint schema — the one sanctioned camelCase exception.
      required: [schemaVersion, label, message, color, cacheSeconds, isError]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        label: { type: string, enum: [IPv6] }
        message: { type: string, enum: [supported, full, partial, no IPv6, inactive, unknown] }
        color: { type: string, enum: [brightgreen, yellow, red, lightgrey] }
        cacheSeconds: { type: integer, example: 86400 }
        isError: { type: boolean }

    JSONFeed:
      type: object
      required: [version, title, home_page_url, feed_url, items]
      properties:
        version: { type: string, enum: ["https://jsonfeed.org/version/1.1"] }
        title: { type: string }
        home_page_url: { type: string }
        feed_url: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, title, content_text, date_published]
            properties:
              id: { type: string, description: "The composite (host, ts, field) as a stable IRI." }
              url: { type: string }
              title: { type: string }
              content_text: { type: string }
              date_published: { type: string, format: date-time }

    ManifestLatest:
      type: object
      required: [date, path, datapackage_url]
      properties:
        date: { type: string, format: date }
        path: { type: string }
        datapackage_url: { type: string }
    ManifestEntry:
      type: object
      required: [date, path, tiers, formats, datapackage_url, sha256sums_url]
      properties:
        date: { type: string, format: date }
        path: { type: string }
        tiers:
          type: array
          items: { type: string, enum: [top100k, top1m, full] }
        formats:
          type: array
          items: { type: string, enum: [csv.gz, parquet] }
        datapackage_url: { type: string }
        sha256sums_url: { type: string }
    Manifest:
      type: object
      description: The pinned datasets index (schema_version bumps with the column set).
      required: [schema_version, generated_at, generation, license, attribution, latest, snapshots]
      properties:
        schema_version: { type: integer, example: 1 }
        generated_at: { type: string, format: date-time }
        generation: { type: integer }
        license: { type: string }
        attribution: { type: string }
        latest: { $ref: "#/components/schemas/ManifestLatest" }
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/ManifestEntry" }

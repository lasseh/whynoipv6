# oapi-codegen v2 config (07-api.md §7): models + embedded spec committed
# under backend/internal/api/gen/ — handlers are hand-written, so no server
# scaffolding is generated. Output path is relative to the backend/ module
# root (make generate runs there).
package: gen
output: internal/api/gen/api.gen.go
generate:
  models: true
  embedded-spec: true

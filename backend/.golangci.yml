version: "2"
linters:
  enable:
    - bodyclose
    - errname
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - godot
    - gosec
    - makezero
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        # G304 (file inclusion): every os.Open/ReadFile takes an operator
        # path — v6ctl flags, the campaign checkout, the export dir. The
        # API never opens a caller-supplied path.
        - G304
        # G301/G302/G306 (permissions): the export snapshots are served by
        # nginx and the GeoIP mmdb is read by the crawler user, so 0755/0644
        # is the contract, not an oversight.
        - G301
        - G302
        - G306
    revive:
      rules:
        - name: unexported-return
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Lifted engine code (01-engine.md): detail-map keys repeat by design;
      # constantizing them would churn the verbatim lift.
      - path: internal/checker/
        linters:
          - goconst
      # cobra verb literals ("list", "add") repeat across command groups.
      - path: cmd/v6ctl/
        linters:
          - goconst
      # The API package is a serialization surface: the same wire words
      # ("base", "saint", "tld") repeat across independent vocabularies —
      # query params, JSON keys, CSV headers, SQL dimension names, feed
      # copy. A shared constant would couple vocabularies that only
      # coincidentally spell alike.
      - path: internal/api/
        linters:
          - goconst
      # Fixture/scripting literals in tests are values, not constants, and
      # gocritic's performance hints (hugeParam etc.) are noise in tests.
      # gosec's fixture-file and bind-address findings are noise there too.
      - path: _test\.go
        linters:
          - goconst
          - gocritic
          - gosec
          - unparam
          - noctx
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

version: "2"
linters:
  enable:
    - errname
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - godot
    - misspell
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: unexported-return
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Lifted engine code (01-engine.md): detail-map keys repeat by design;
      # constantizing them would churn the verbatim lift.
      - path: internal/checker/
        linters:
          - goconst
      # cobra verb literals ("list", "add") repeat across command groups.
      - path: cmd/v6ctl/
        linters:
          - goconst
      # The API package is a serialization surface: the same wire words
      # ("base", "saint", "tld") repeat across independent vocabularies —
      # query params, JSON keys, CSV headers, SQL dimension names, feed
      # copy. A shared constant would couple vocabularies that only
      # coincidentally spell alike.
      - path: internal/api/
        linters:
          - goconst
      # Fixture/scripting literals in tests are values, not constants, and
      # gocritic's performance hints (hugeParam etc.) are noise in tests.
      - path: _test\.go
        linters:
          - goconst
          - gocritic
          - unparam
          - noctx
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

# ns_host -> DNS-provider mapping seed (06-ingest.md 6.10, 6.11).
#
# Loaded by `v6ctl provider seed` (path from --path, else dns_provider.seed_path).
# Each entry is one `v6ctl provider add <name> <suffix>...`: upsert by name,
# suffixes appended and deduped, so re-running the file is idempotent.
#
# A suffix matches an observed nameserver host on a label boundary
# (ns == suffix, or ns ends with "." + suffix). The longest match across a
# domain's whole NS set wins, so entries may safely overlap. Domains re-stamp
# on their next scan commit, so edits here take effect within one frontier
# pass -- no backfill needed.
#
# This is a starting set of major managed-DNS operators, not a closed list.
# To find what is still unattributed, sort observed NS suffixes by domain
# count and curate downward (see docs/deploy.md).

- name: Cloudflare
  suffixes:
    - ns.cloudflare.com
    - foundationdns.com
    - foundationdns.org

# Route 53 gives each hosted zone four nameservers of the form
# ns-<n>.awsdns-<nn>.<tld>, drawn from four TLDs with <nn> in 00-63.
# Only awsdns-<nn>.<tld> is a usable label-boundary suffix (the bare
# TLD would match the whole internet), so all 4x64 are listed.

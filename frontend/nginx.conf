# SPA serving for the frontend container (history-mode routes fall back to
# index.html). Production serving is deploy/nginx/whynoipv6.com.conf — keep
# gzip, cache lifetimes, and security headers in sync with it so dev perf and
# security tests reflect prod. No CSP here: connect-src needs the baked
# per-build API origin, so a hardcoded policy would break one env or another.
# No HSTS: the container listens on plain :80 behind whatever fronts dev.
# add_header does not inherit into a location that sets its own headers, so
# every location below that adds Cache-Control repeats the set.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml;

    # --- hashed build assets are immutable ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # --- images and fonts: stable but unhashed, cache a day ---
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # --- blog: prerendered files (scripts/blog-plugin.ts); no-cache so a
    # cached copy can't outlive its hashed bundles, same as prod. $uri.html
    # serves the canonical slashless /blog/<slug> without nginx's
    # directory 301. ---
    location = /blog {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files /blog.html /index.html;
    }

    location /blog/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # RFC 9116 canonical path; the file ships at the webroot as /security.txt.
    location = /.well-known/security.txt {
        try_files /security.txt =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

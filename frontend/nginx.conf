# SPA serving for the frontend container (history-mode routes fall back to
# index.html). Production serving is deploy/nginx/whynoipv6.com.conf — keep
# gzip and cache lifetimes in sync with it so dev perf tests reflect prod.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml;

    # --- hashed build assets are immutable ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- images and fonts: stable but unhashed, cache a day ---
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

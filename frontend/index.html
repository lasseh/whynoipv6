<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://whynoipv6.com/" />
    <!-- LCP is text: preload the latin Inter subset so first paint uses it.
         Preconnect to the API origin (baked per-env) ahead of the app's first fetch. -->
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IPv6 Shaming" />
    <meta name="author" content="Lasse Haugen" />
    <meta property="og:image" content="https://whynoipv6.com/images/WhyNoSticker.webp" />
    <meta
      property="og:title"
      content="Why No IPv6? The World&#39;s Largest Websites Lacking IPv6 Support"
    />
    <meta
      property="og:description"
      content='The IPv4 exhaustion is becoming a real problem for the internet, "Why No IPv6?" is a who&#39;s who of the world&#39;s biggest websites globally and by country, still not migrated to IPv6.'
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://whynoipv6.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@WhyNoIPv6" />
    <meta name="twitter:title" content="IPv6 Shame as a Service" />
    <meta
      name="twitter:description"
      content='The IPv4 exhaustion is becoming a real problem for the internet, "Why No IPv6?" is a who&#39;s who of the world&#39;s biggest websites globally and by country, still not migrated to IPv6.'
    />
    <meta name="twitter:image" content="https://whynoipv6.com/images/WhyNoSticker.webp" />
    <meta name="twitter:url" content="https://whynoipv6.com/" />
    <meta name="twitter:creator" content="@whynoipv6" />
    <meta http-equiv="Content-Language" content="en" />
    <meta name="google" content="notranslate" />
    <title>Why No IPv6?</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://whynoipv6.com/#website",
            "url": "https://whynoipv6.com/",
            "name": "Why No IPv6?",
            "description": "A who's who of the world's biggest websites, globally and by country, still not migrated to IPv6.",
            "publisher": { "@id": "https://whynoipv6.com/#org" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://whynoipv6.com/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://whynoipv6.com/#org",
            "name": "Why No IPv6?",
            "url": "https://whynoipv6.com/",
            "sameAs": ["https://github.com/lasseh/whynoipv6", "https://twitter.com/WhyNoIPv6"]
          },
          {
            "@type": "Dataset",
            "@id": "https://whynoipv6.com/#dataset",
            "name": "WhyNoIPv6 domain IPv6-adoption dataset",
            "description": "Confirmed IPv6 adoption state (base domain, www, nameservers, mail) for the top 1M websites, with per-country and per-campaign rollups. Attribution: Data: whynoipv6.com (CC-BY-NC-4.0). Ranks: Tranco.",
            "url": "https://whynoipv6.com/",
            "license": "https://creativecommons.org/licenses/by-nc/4.0/",
            "creator": { "@id": "https://whynoipv6.com/#org" },
            "distribution": {
              "@type": "DataDownload",
              "contentUrl": "https://api.whynoipv6.com/datasets"
            }
          }
        ]
      }
    </script>

    <script
      defer
      src="https://whynoipv6.com/stats.js"
      data-website-id="17667fdb-fe13-4ce6-910f-7559aebb9edf"
      data-host-url="https://whynoipv6.com"
    ></script>
  </head>
  <body class="font-inter antialiased bg-zinc-900 text-slate-200 tracking-tight">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- canonical is set per-route by installPageMeta — a static one would
         claim the homepage as canonical for every route. -->
    <!-- LCP is text: preload the latin Inter subset so first paint uses it.
         Preconnect to the API origin (baked per-env) ahead of the app's first fetch. -->
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Why No IPv6 Blog"
      href="https://whynoipv6.com/blog/rss.xml"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Why No IPv6 checks the Tranco top million every day for IPv6 across DNS, web, and mail. Sinners, Heroes, Saints. Shame on them."
    />
    <meta name="author" content="Lasse Haugen" />
    <!-- No static og:url/twitter:url: scrapers fall back to the URL actually
         shared, so SPA routes don't all canonicalize to the homepage. The
         prerendered blog pages append their own per-page URLs (posts.ts). -->
    <meta property="og:site_name" content="Why No IPv6" />
    <meta property="og:image" content="https://whynoipv6.com/images/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A nun ringing a shame bell beside the Why No IPv6 wordmark"
    />
    <meta
      property="og:title"
      content="Why No IPv6: checking the web&#39;s biggest sites for IPv6"
    />
    <meta
      property="og:description"
      content="IPv4 ran out. We crawl the Tranco top million every day and publish their IPv6 results, with country and campaign standings."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IPv6 Shame as a Service" />
    <meta
      name="twitter:description"
      content="IPv4 ran out. We crawl the Tranco top million every day and publish their IPv6 results, with country and campaign standings."
    />
    <meta name="twitter:image" content="https://whynoipv6.com/images/share-card.png" />
    <meta http-equiv="Content-Language" content="en" />
    <meta name="google" content="notranslate" />
    <title>Why No IPv6</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://whynoipv6.com/#website",
            "url": "https://whynoipv6.com/",
            "name": "Why No IPv6",
            "description": "Daily IPv6 measurements for the Tranco top million and campaign lists, with domain, country, and provider standings.",
            "publisher": { "@id": "https://whynoipv6.com/#org" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://whynoipv6.com/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://whynoipv6.com/#org",
            "name": "Why No IPv6",
            "url": "https://whynoipv6.com/",
            "sameAs": ["https://github.com/lasseh/whynoipv6"]
          },
          {
            "@type": "Dataset",
            "@id": "https://whynoipv6.com/#dataset",
            "name": "whynoipv6.com IPv6 adoption dataset (top 1M domains)",
            "description": "Confirmed IPv6 adoption state (base domain, www, nameservers, mail) for the Tranco top 1M domains, with per-country and per-campaign rollups. Attribution: Data: whynoipv6.com (CC-BY-NC-4.0). Ranks: Tranco.",
            "url": "https://whynoipv6.com/",
            "license": "https://creativecommons.org/licenses/by-nc/4.0/",
            "creator": { "@id": "https://whynoipv6.com/#org" },
            "distribution": [
              {
                "@type": "DataDownload",
                "contentUrl": "https://api.whynoipv6.com/datasets/latest/whynoipv6-full.csv.gz",
                "encodingFormat": ["text/csv", "application/gzip"]
              },
              {
                "@type": "DataDownload",
                "contentUrl": "https://api.whynoipv6.com/datasets/latest/whynoipv6-full.parquet",
                "encodingFormat": "application/vnd.apache.parquet"
              }
            ]
          }
        ]
      }
    </script>

    <script
      defer
      src="https://whynoipv6.com/stats.js"
      data-website-id="17667fdb-fe13-4ce6-910f-7559aebb9edf"
      data-host-url="https://whynoipv6.com"
    ></script>
  </head>
  <body class="font-inter antialiased bg-zinc-900 text-slate-200 tracking-tight">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

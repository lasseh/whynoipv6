name: backend

# Path-filtered: a frontend-only commit cannot break the Go build, the schema
# or the OpenAPI contract, and running the Timescale integration suite for it
# only buys flake exposure. openapi/ is in both gates — it drives the Go
# codegen drift check here and the frontend's schema.ts types over there.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'openapi/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'openapi/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      # Pinned action instead of curl|sh from HEAD: cached, and the linter
      # binary is no longer the weakest supply-chain link in CI.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: backend

      - name: Install tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tidy
        run: make tidy

      - name: Generate (staleness gate)
        run: make generate

      - name: OpenAPI spec lint (Spectral)
        run: make spec-lint

      - name: Unit tests
        run: make test

      # Boots one TimescaleDB container for the whole run and dumps its status
      # and logs if anything fails — see backend/Makefile testdb-up.
      - name: Integration tests
        run: make test-integration

      - name: Vulnerability scan
        run: make vulncheck

      - name: Release build
        run: make build-linux

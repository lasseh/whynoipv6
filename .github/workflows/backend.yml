name: backend

# Path-filtered: a frontend-only commit cannot break the Go build, the schema
# or the OpenAPI contract, and running the Timescale integration suite for it
# only buys flake exposure. openapi/ is in both gates — it drives the Go
# codegen drift check here and the frontend's schema.ts types over there.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'openapi/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
      - 'deploy/**'
      - 'docs/spec/09-ops.md'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'openapi/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
      - 'deploy/**'
      - 'docs/spec/09-ops.md'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Pinned action instead of curl|sh from HEAD: cached, and the linter
      # binary is no longer the weakest supply-chain link in CI.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, unlike everything else here: `latest` picks up new default
          # analyzers on a release we did not choose, so a PR that changes
          # nothing goes red. This is the version the repo passes today; bump
          # it with the dependency updates, not by surprise.
          version: v2.13.1
          working-directory: backend

      # sqlc is NOT installed here: it rides in go.mod through the `tool`
      # directive, so `make generate`'s drift gate compares the committed
      # output against a generator version that is itself committed. A new
      # sqlc release used to turn every open PR red with a diff nobody wrote.
      # govulncheck and gotestsum stay rolling on purpose — neither decides
      # whether a diff is stale.
      - name: Install tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tidy
        run: make tidy

      - name: Generate (staleness gate)
        run: make generate

      - name: OpenAPI spec lint (Spectral)
        run: make spec-lint

      - name: Unit tests
        run: make test

      # Boots one TimescaleDB container for the whole run and dumps its status
      # and logs if anything fails — see backend/Makefile testdb-up.
      - name: Integration tests
        run: make test-integration

      - name: Vulnerability scan
        run: make vulncheck

      - name: Release build
        run: make build-linux

name: ci

on:
  pull_request:
  push:
    # Both names until the remote standardizes; drop the loser then.
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      # Pinned action instead of curl|sh from HEAD: cached, and the linter
      # binary is no longer the weakest supply-chain link in CI.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: backend

      - name: Install tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tidy
        run: make tidy

      - name: Generate (staleness gate)
        run: make generate

      - name: OpenAPI spec lint (Spectral)
        run: make spec-lint

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration

      - name: Vulnerability scan
        run: make vulncheck

      - name: Release build
        run: make build-linux

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts closes the postinstall supply-chain vector; nothing
      # in the tree needs lifecycle scripts (only darwin-only fsevents has one).
      - name: Install deps
        run: npm ci --ignore-scripts
        working-directory: frontend

      # Full tree, dev deps included: build tooling runs on this runner and
      # generates every shipped byte, so its advisories gate too.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Lint (type-check + eslint + prettier)
        run: make frontend-lint

      - name: Unit tests
        run: make frontend-test

      - name: Build
        run: make frontend-build

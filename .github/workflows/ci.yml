name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      - name: Install tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Tidy
        run: make tidy

      - name: Lint
        run: make lint

      - name: Generate (staleness gate)
        run: make generate

      - name: OpenAPI spec lint (Spectral)
        run: make spec-lint

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration

      - name: Vulnerability scan
        run: make vulncheck

      - name: Release build
        run: make build-linux

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts closes the postinstall supply-chain vector; nothing
      # in the tree needs lifecycle scripts (only darwin-only fsevents has one).
      - name: Install deps
        run: npm ci --ignore-scripts
        working-directory: frontend

      # Full tree, dev deps included: build tooling runs on this runner and
      # generates every shipped byte, so its advisories gate too.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Lint (type-check + eslint + prettier)
        run: make frontend-lint

      - name: Unit tests
        run: make frontend-test

      - name: Build
        run: make frontend-build

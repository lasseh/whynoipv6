name: release

# Cut with `make release` (tags vX.Y.Z and pushes the tag); this builds the
# linux binaries, publishes a GitHub Release, then builds the backend image,
# fails the release if Trivy finds CRITICAL/HIGH vulns in it, and only then
# pushes it to GHCR.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lasseh/whynoipv6

jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum

      # Server software: linux only. Version provenance rides in Go's
      # embedded VCS build info (go version -m <binary>).
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        working-directory: backend
        run: |
          for b in api crawler v6ctl; do
            CGO_ENABLED=0 go build -ldflags="-s -w" \
              -o "../whynoipv6-${b}-linux-${GOARCH}" "./cmd/${b}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: whynoipv6-*-linux-${{ matrix.goarch }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          generate_release_notes: true
          files: dist/*

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # A release whose binaries do not build must not publish an image.
    needs: binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The backend image carries all three binaries with /api as entrypoint
      # (backend/Dockerfile); the frontend image bakes its API origin per
      # environment, so it is deployed from compose/Ansible, not released.
      #
      # Three steps, not one, and the order is the point: the header promises
      # to fail the release if Trivy finds CRITICAL/HIGH, and `push: true`
      # here published :X.Y.Z before the scan ran. A red job does not
      # unpublish a tag. So: build into the local daemon, scan that image,
      # and only then push. The second build is a cache hit — the layers are
      # already in the gha cache from the first — so this costs a re-export,
      # not a rebuild.
      #
      # The scan needs an image the local docker daemon can see, which a
      # multi-arch build cannot produce (`load: true` refuses more than one
      # platform). So the gate builds amd64 alone and scans it; the
      # vulnerabilities Trivy reports here live in the distroless base and the
      # Go binaries, neither of which differs by architecture.
      - name: Build amd64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      # Only now. Same context and the same checkout, so the sha tag names
      # the commit that was scanned.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # TS 7.0 ships no JS API, which vue-tsc, typescript-eslint and
    # openapi-typescript all need. 7.1 still opens a PR.
    ignore:
      - dependency-name: typescript
        versions:
          - '~7.0.0'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

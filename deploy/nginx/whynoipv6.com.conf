# whynoipv6.com — the static SPA bundle (12-frontend.md §12).
# Old singular URLs 301 to the plural canonicals (§5): anchored so /domain can
# never re-match /domains and loop, trailing-slash-stripping because the old
# router *forced* trailing slashes onto detail URLs. `rewrite` preserves the
# query string by default.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whynoipv6.com;

    # Cloudflare Origin CA, not Let's Encrypt: one 15-year cert for the apex +
    # *.whynoipv6.com covers all three server blocks here and in the API vhost.
    # Full (strict) accepts a cert from a publicly trusted CA *or* Cloudflare's
    # Origin CA, and since only the edge ever connects to this origin, the lack
    # of browser trust costs nothing — while the 90-day ACME renewal, which is
    # an outage under Full (strict) when it fails, goes away entirely. Paths are
    # templated by the Ansible role (whynoipv6_nginx_ssl_certificate); the key
    # is vaulted. Any hostname NOT behind Cloudflare must stay on certbot.
    ssl_certificate     /etc/ssl/cloudflare/whynoipv6.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/whynoipv6.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/whynoipv6.com;
    index index.html;

    # Cloudflare fronts this vhost, so the socket peer is an edge PoP: the umami
    # proxy's X-Umami-Client-IP below depends on the host's conf.d/cloudflare.conf
    # (lasseh/nginx-conf) having rewritten $remote_addr to the visitor. It is
    # loaded globally at http{} scope, so nothing is included here — but without
    # it every visitor geolocates to the PoP.

    # --- security headers. Everything is first-party: fonts/flags/images are
    # self-hosted, umami is proxied through this origin, and the only cross-
    # origin fetch is the API. add_header does NOT inherit into a location
    # that sets its own headers, so every location below that adds
    # Cache-Control repeats these four. HSTS carries includeSubDomains +
    # preload because this domain is on the HSTS preload list, which requires
    # both: the origin emits the qualifying header itself so preload
    # eligibility never depends on the CDN's HSTS toggle staying on. ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml;

    # --- legacy singular → plural canonicals (SEO-real 301s) ---
    rewrite ^/domain$            /domains  permanent;
    rewrite ^/domain/(.+?)/?$    /domains/$1  permanent;
    rewrite ^/country$           /countries  permanent;
    rewrite ^/country/(.+?)/?$   /countries/$1  permanent;
    rewrite ^/campaign$          /campaigns  permanent;
    rewrite ^/campaign/(.+?)/?$  /campaigns/$1  permanent;

    # --- hashed build assets are immutable ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # --- images and fonts: stable but unhashed, cache a day ---
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # --- blog: real prerendered files (frontend/scripts/blog-plugin.ts) —
    # blog/<slug>.html per post, blog.html + blog/index.html for the list,
    # blog/rss.xml. Flat files so the canonical slashless /blog/<slug>
    # serves via $uri.html without nginx's directory 301. Same no-cache
    # rule as index.html: a heuristically-cached copy can outlive its
    # hashed bundles after a deploy. Unknown slugs fall through to the SPA
    # fallback. ---
    location = /blog {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /blog.html /index.html;
    }

    location /blog/ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # --- umami analytics, fully first-party so ad blockers don't drop it:
    # EasyPrivacy's ||umami.is^$third-party covers both the script CDN and the
    # collect gateway (.scratch/frontend-rebuild issue 04). index.html loads
    # /stats.js from this origin and data-host-url points the tracker's POST
    # at /api/send here; both proxy to Umami Cloud, so a CSP needs no umami
    # origins. The upstreams sit behind Cloudflare: resolve via the host's
    # unbound instances at request time so rotated anycast IPs don't outlive a
    # reload, and send SNI or the handshake is refused. The trusted-cert path
    # is the Debian/Ubuntu system bundle.
    location = /stats.js {
        resolver 127.0.0.1 127.0.0.1:5353 valid=300s;
        set $umami_cloud https://cloud.umami.is;
        proxy_pass $umami_cloud/script.js;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    location = /api/send {
        resolver 127.0.0.1 127.0.0.1:5353 valid=300s;
        set $umami_gateway https://gateway.umami.is;
        proxy_pass $umami_gateway/api/send;
        # cloud-mode umami reads this header before Cloudflare's
        # cf-connecting-ip; without it every visitor geolocates to this VM.
        proxy_set_header X-Umami-Client-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # --- index.html must always revalidate: a heuristically-cached copy can
    # outlive its hashed bundles after a deploy and white-screen the page.
    # try_files' /index.html fallback internally redirects here, so SPA
    # routes get this too. ---
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name whynoipv6.com www.whynoipv6.com;
    return 301 https://whynoipv6.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.whynoipv6.com;

    ssl_certificate     /etc/ssl/cloudflare/whynoipv6.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/whynoipv6.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://whynoipv6.com$request_uri;
}

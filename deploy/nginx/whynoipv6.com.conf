# whynoipv6.com — the static SPA bundle (12-frontend.md §12).
# Old singular URLs 301 to the plural canonicals (§5): anchored so /domain can
# never re-match /domains and loop, trailing-slash-stripping because the old
# router *forced* trailing slashes onto detail URLs. `rewrite` preserves the
# query string by default.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whynoipv6.com;

    ssl_certificate     /etc/letsencrypt/live/whynoipv6.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whynoipv6.com/privkey.pem;

    root /var/www/whynoipv6.com;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml;

    # --- legacy singular → plural canonicals (SEO-real 301s) ---
    rewrite ^/domain$            /domains  permanent;
    rewrite ^/domain/(.+?)/?$    /domains/$1  permanent;
    rewrite ^/country$           /countries  permanent;
    rewrite ^/country/(.+?)/?$   /countries/$1  permanent;
    rewrite ^/campaign$          /campaigns  permanent;
    rewrite ^/campaign/(.+?)/?$  /campaigns/$1  permanent;

    # --- hashed build assets are immutable ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- umami analytics: index.html loads /script.js from this origin; proxy
    # it to Umami Cloud, as the old Vercel deployment's rewrite did. The
    # tracker POSTs straight to https://gateway.umami.is/api/send (endpoint is
    # baked into the cloud script), so no /api/send proxy — but any future CSP
    # must allow that origin in connect-src (.scratch/frontend-rebuild issue 04).
    location = /script.js {
        # cloud.umami.is sits behind Cloudflare: resolve via the host's unbound
        # instances at request time so rotated anycast IPs don't outlive a
        # reload, and send SNI or the handshake is refused. The trusted-cert
        # path is the Debian/Ubuntu system bundle.
        resolver 127.0.0.1 127.0.0.1:5353 valid=300s;
        set $umami_cloud https://cloud.umami.is;
        proxy_pass $umami_cloud/script.js;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name whynoipv6.com www.whynoipv6.com;
    return 301 https://whynoipv6.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.whynoipv6.com;

    ssl_certificate     /etc/letsencrypt/live/whynoipv6.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whynoipv6.com/privkey.pem;

    return 301 https://whynoipv6.com$request_uri;
}

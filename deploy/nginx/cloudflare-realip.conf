# Cloudflare edge → real client IP. Deploys to /etc/nginx/cloudflare-realip.conf
# (NOT conf.d/, which nginx auto-includes at http{} scope — the two vhosts pull
# this in per-server instead, so the trust list never leaks to another site on
# the box).
#
# whynoipv6.com, www, and api.whynoipv6.com are all Cloudflare-proxied, so every
# request reaches nginx from a PoP and the socket peer is an edge address, not
# the visitor. Four things downstream read the peer address and all four are
# wrong without this:
#
#   - `X-Real-IP` to the API, which 07-api.md §1.2 makes the single source of
#     truth for the `GET /ip` visitor banner (12-frontend.md §9.5 warns iff
#     family != ipv6 — on this site of all sites it has to be the visitor's own
#     address) and for the `POST /check` per-IP + per-/64 rate limiter;
#   - the `api_perip` / `api_csv` limit_req zones, which would bucket every
#     visitor behind a PoP together;
#   - `X-Umami-Client-IP`, which would geolocate all traffic to the PoP.
#
# Rewriting $remote_addr in the POST_READ phase fixes all four at once and runs
# before limit_req (PREACCESS), so the vhosts keep the proxy_set_header block
# exactly as 07-api.md §1.2 specifies. real_ip_recursive stays default-off:
# CF-Connecting-IP is a single address the edge sets itself, not a chain.
#
# Ranges are Cloudflare's published list, fetched 2026-08-13:
#   curl https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
# They change rarely (years); re-fetch when Cloudflare announces a change. A
# stale list fails safe — an unlisted edge just leaves $remote_addr as the PoP.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

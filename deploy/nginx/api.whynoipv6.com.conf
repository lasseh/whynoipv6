# api.whynoipv6.com — API reverse proxy + static datasets (09-ops.md §7).
# The app owns every Cache-Control per endpoint class (07-api.md); this vhost
# never sets a blanket no-store and never hides the app's headers — the
# RFC 9457 problem+json Content-Type and the RateLimit/RateLimit-Policy/
# Retry-After headers pass through unmodified.

# --- edge rate limits (http{} scope — this file is included there). The app
# only limits POST /check; every read is throttled here instead. A general
# per-IP zone covers the whole vhost, and a much stricter zone covers the
# 10k-row ?format=csv exports: the map keys csv requests by client address
# and everything else to "", which limit_req skips. ---
limit_req_zone $binary_remote_addr zone=api_perip:10m rate=10r/s;
map $arg_format $api_csv_client {
    default "";
    csv     $binary_remote_addr;
}
limit_req_zone $api_csv_client zone=api_csv:10m rate=6r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.whynoipv6.com;

    ssl_certificate     /etc/letsencrypt/live/api.whynoipv6.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.whynoipv6.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cloudflare fronts this vhost: recover the visitor's address before
    # limit_req keys on it and before X-Real-IP is set below.
    include /etc/nginx/cloudflare-realip.conf;

    # HSTS everywhere; nosniff only where nginx serves files itself — the app
    # already sets it on proxied responses. add_header does NOT inherit into
    # the dataset locations below (they set Cache-Control), so they repeat it.
    # includeSubDomains + preload because whynoipv6.com is on the HSTS preload
    # list, which requires both: the origin emits the qualifying header itself
    # so preload eligibility never depends on the CDN's HSTS toggle staying on.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    limit_req zone=api_perip burst=30 nodelay;
    limit_req zone=api_csv   burst=3  nodelay;
    limit_req_status 429;

    # --- edge compression (report §7.4): gzip at the origin, Brotli at the CDN.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types application/json application/problem+json application/atom+xml
               application/feed+json text/csv image/svg+xml;

    # --- datasets: dated snapshots are immutable forever ---
    location ~ "^/datasets/\d{4}-\d{2}-\d{2}/" {
        root /var/lib/whynoipv6;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        gzip off;   # payloads are pre-compressed (.csv.gz) or binary (.parquet)
    }

    # --- datasets: latest/ symlink + DICTIONARY.md, mutable, short TTL ---
    location /datasets/ {
        root /var/lib/whynoipv6;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        gzip off;
    }

    # --- datasets manifest: exact match → API (app sets max-age=300) ---
    location = /datasets {
        proxy_pass http://[::1]:8080;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header Host             $host;
    }

    # --- everything else → API (no /v1 segment; resources at the root) ---
    location / {
        proxy_pass http://[::1]:8080;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header Host             $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.whynoipv6.com;
    return 301 https://$host$request_uri;
}

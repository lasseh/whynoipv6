# whynoipv6.com — the static SPA bundle (12-frontend.md §12).
# Old singular URLs 301 to the plural canonicals (§5): anchored so /domain can
# never re-match /domains and loop, trailing-slash-stripping because the old
# router *forced* trailing slashes onto detail URLs. `rewrite` preserves the
# query string by default.
#
# Everything this vhost serves is one client-rendered shell, so any URL shape
# that resolves 200 is a byte-identical duplicate until JS runs. The rewrite
# block below is therefore load-bearing for indexing, not cosmetic: it is the
# only canonicalisation a non-rendering crawler ever sees. Redirect assertions
# live in backend/internal/api/nginx_integration_test.go.
# >>> ipv4 drill

# --- planned IPv4 unavailability, draft-martin-retry-over-ipv6 --------------
# Once a month this site stops answering over IPv4 while serving normally over
# IPv6, so IPv4 visitors get 503 + Retry-Over-IPv6: ?1 and a page that explains
# it, rather than a timeout. A shame site reachable only over IPv4 is not
# making its point. See frontend/src/pages/Ipv4Outage.vue for the public copy.
#
# These maps sit at http{} scope, like the rate-limit maps in the API vhost.
# The window is the 6th of each month, 00:00-24:00 UTC, so the nginx process
# must run with TZ=UTC: $time_iso8601 is local time, not UTC.

# The one operator knob. `schedule` follows the coordinated window, `on` runs
# an ad-hoc drill from the next reload, `off` disables the whole mechanism.
# nginx_integration_test.go rewrites this line to drive both states, since it
# cannot move the container's clock onto the 6th.
map $host $ipv4_outage_mode {
    default schedule;
}

map $time_iso8601 $ipv4_outage_window {
    default              0;
    "~^\d{4}-\d{2}-06T"  1;
}

map "$ipv4_outage_mode:$ipv4_outage_window" $ipv4_outage_on {
    default      0;
    "~^on:"      1;
    "schedule:1" 1;
}

# Client address family. This reads the *visitor* and not the socket peer only
# because the host's conf.d/cloudflare.conf (lasseh/nginx-conf) has rewritten
# $remote_addr from CF-Connecting-IP — the same dependency the umami proxy
# below already carries. Without it every visitor is a Cloudflare PoP and the
# drill fires on nobody or on everybody. Loopback is skipped so local health
# checks keep working through a window.
map $remote_addr $ipv4_outage_client {
    default                 0;
    "~^127\."               0;
    "~^\d+\.\d+\.\d+\.\d+$" 1;
}

# Search engines sit out the drill. Googlebot crawls almost entirely over IPv4,
# so without this every window is a site-wide outage in Search Console, and a
# monthly 5xx across a whole day is exactly the pattern that suppresses crawl
# rate. The drill measures whether *people* recover onto IPv6; a crawler is not
# part of that population and would not act on the signal anyway. Note this is
# User-Agent matching and therefore trivially spoofed — which is fine, because
# opting yourself out of a voluntary drill harms nobody. A Cloudflare transform
# rule stamping cf.client.bot into a header would be the stronger version.
map $http_user_agent $ipv4_outage_crawler {
    default 0;
    "~*(googlebot|google-inspectiontool|storebot-google|bingbot|slurp|duckduckbot|baiduspider|yandexbot|applebot|petalbot|ia_archiver)" 1;
}

map "$ipv4_outage_on:$ipv4_outage_client:$ipv4_outage_crawler" $signal_ipv4_unavailable {
    default 0;
    "1:1:0" 1;
}

# End of the window, ISO 8601, for the problem+json body. The coordinated rule
# comes first: the 6th rolls into the 7th, which never crosses a month, so no
# month arithmetic is needed. The second is the fallback for an ad-hoc drill,
# which has no scheduled end. Named captures interpolate into the map value.
map $time_iso8601 $ipv4_outage_until {
    default                        "";
    "~^(?<ym>\d{4}-\d{2})-06T"     "${ym}-07T00:00:00Z";
    "~^(?<ymd>\d{4}-\d{2}-\d{2})T" "${ymd}T23:59:59Z";
}

# Browsers and curl get the HTML helper page; problem+json only when asked for.
map $http_accept $ipv4_outage_variant {
    default                       html;
    "~*application/problem\+json" json;
    "~*application/json"          json;
}

# <<< ipv4 drill
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whynoipv6.com;

    # Cloudflare Origin CA, not Let's Encrypt: one 15-year cert for the apex +
    # *.whynoipv6.com covers all three server blocks here and in the API vhost.
    # Full (strict) accepts a cert from a publicly trusted CA *or* Cloudflare's
    # Origin CA, and since only the edge ever connects to this origin, the lack
    # of browser trust costs nothing — while the 90-day ACME renewal, which is
    # an outage under Full (strict) when it fails, goes away entirely. Paths are
    # templated by the Ansible role (whynoipv6_nginx_ssl_certificate); the key
    # is vaulted. Any hostname NOT behind Cloudflare must stay on certbot.
    ssl_certificate     /etc/ssl/cloudflare/whynoipv6.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/whynoipv6.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/whynoipv6.com;
    index index.html;
    # >>> ipv4 drill

    # --- planned IPv4 unavailability (draft-martin-retry-over-ipv6). Ahead of
    # the rewrites below because both run in the rewrite phase in source order,
    # and during a window the signal outranks canonicalisation. `return` is one
    # of the two directives that are safe inside `if`. Everything this vhost
    # serves is gated, umami beacons included: a partial outage is not a drill,
    # and IPv4 analytics going quiet is the point being made. The exceptions are
    # search engines and the crawler control files, both handled below.
    # The maps are at the top of this file. ---
    # The error_page redirect below rewrites $uri to the handler and re-runs
    # this rewrite phase, so without the guard the gate fires a second time —
    # and with recursive_error_pages off nginx then falls back to its own 503
    # body, dropping the signal headers. `set` is re-evaluated on every phase
    # run; a map is cached for the whole request and would go stale here.
    set $ipv4_outage_gate $signal_ipv4_unavailable;
    # Anchored and enumerated: an unanchored prefix would let an IPv4 client
    # clear the gate for itself by asking for /__ipv4-unavailable-anything,
    # falling through to the SPA shell at 200.
    if ($uri ~ "^/__ipv4-unavailable-(html|json)$") {
        set $ipv4_outage_gate 0;
    }
    # Never the crawler control files, for anyone. A 5xx on robots.txt does not
    # read as "this page is briefly unavailable" — Google takes it as disallow
    # everything and stops crawling the site until it can fetch one again, so a
    # gated robots.txt turns a one-day drill into a one-day deindexing risk.
    if ($uri ~ "^/(robots\.txt|sitemap\.xml)$") {
        set $ipv4_outage_gate 0;
    }
    if ($ipv4_outage_gate) {
        return 503;
    }
    error_page 503 /__ipv4-unavailable-$ipv4_outage_variant;
    # <<< ipv4 drill

    # Cloudflare fronts this vhost, so the socket peer is an edge PoP: the umami
    # proxy's X-Umami-Client-IP below depends on the host's conf.d/cloudflare.conf
    # (lasseh/nginx-conf) having rewritten $remote_addr to the visitor. It is
    # loaded globally at http{} scope, so nothing is included here — but without
    # it every visitor geolocates to the PoP.

    # --- security headers. Everything is first-party: fonts/flags/images are
    # self-hosted, umami is proxied through this origin, and the only cross-
    # origin fetch is the API. add_header does NOT inherit into a location
    # that sets its own headers, so every location below that adds
    # Cache-Control repeats these six. HSTS carries includeSubDomains +
    # preload because this domain is on the HSTS preload list, which requires
    # both: the origin emits the qualifying header itself so preload
    # eligibility never depends on the CDN's HSTS toggle staying on. ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml;

    # --- legacy singular → plural canonicals (SEO-real 301s) ---
    # These come first and strip their own trailing slash, so an old
    # /domain/example.com/ reaches its canonical in one hop rather than two.
    rewrite ^/domain$            /domains  permanent;
    rewrite ^/domain/(.+?)/?$    /domains/$1  permanent;
    rewrite ^/country$           /countries  permanent;
    rewrite ^/country/(.+?)/?$   /countries/$1  permanent;
    rewrite ^/campaign$          /campaigns  permanent;
    rewrite ^/campaign/(.+?)/?$  /campaigns/$1  permanent;

    # --- duplicate URL shapes → the canonical one (GSC "Alternate page with
    # proper canonical tag", 2026-08-23). Each of these used to serve 200 with
    # byte-identical HTML, and only the JS-injected <link rel="canonical">
    # pointed at the real URL — so Google indexed the request URL, rendered it,
    # and then discarded it as an alternate. A 301 says it once, without JS. ---

    # The tier collections are presets over the leaderboard. The slugs come
    # from src/tiers.ts, which also generates the matching client-side
    # redirects in src/router.ts — adding a tier means touching both.
    rewrite ^/(sinners|heroes|saints|almost-heroes)$  /domains?filter=$1  permanent;

    # /index.html is the same document as /. This MUST test $request_uri, not
    # $uri: the SPA fallback reaches index.html through try_files, and that
    # internal redirect re-runs the server rewrite phase with $uri rewritten to
    # /index.html — so matching on $uri 301s every SPA route to /. $request_uri
    # keeps the client's original target, so only a real /index.html hit fires.
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 /;
    }

    # Residual trailing slashes. src/router.ts:251 strips these client-side,
    # but that is a History.replaceState a non-rendering crawler never sees.
    # Last of the rewrites so the legacy rules above keep their one-hop form.
    rewrite ^/(.+?)/+$  /$1  permanent;

    # --- hashed build assets are immutable ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # --- images and fonts: stable but unhashed, cache a day ---
    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # --- blog: real prerendered files (frontend/scripts/blog-plugin.ts) —
    # blog/<slug>.html per post, blog.html + blog/index.html for the list,
    # blog/rss.xml. Flat files so the canonical slashless /blog/<slug>
    # serves via $uri.html without nginx's directory 301. Same no-cache
    # rule as index.html: a heuristically-cached copy can outlive its
    # hashed bundles after a deploy. Unknown slugs fall through to the SPA
    # fallback. ---
    location = /blog {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /blog.html /index.html;
    }

    location /blog/ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # --- umami analytics, fully first-party so ad blockers don't drop it:
    # EasyPrivacy's ||umami.is^$third-party covers both the script CDN and the
    # collect gateway (.scratch/frontend-rebuild issue 04). index.html loads
    # /stats.js from this origin and data-host-url points the tracker's POST
    # at /api/send here; both proxy to Umami Cloud, so a CSP needs no umami
    # origins. The upstreams sit behind Cloudflare: resolve via the host's
    # unbound instances at request time so rotated anycast IPs don't outlive a
    # reload, and send SNI or the handshake is refused. The trusted-cert path
    # is the Debian/Ubuntu system bundle.
    location = /stats.js {
        resolver 127.0.0.1 127.0.0.1:5353 valid=300s;
        set $umami_cloud https://cloud.umami.is;
        proxy_pass $umami_cloud/script.js;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    location = /api/send {
        resolver 127.0.0.1 127.0.0.1:5353 valid=300s;
        set $umami_gateway https://gateway.umami.is;
        proxy_pass $umami_gateway/api/send;
        # cloud-mode umami reads this header before Cloudflare's
        # cf-connecting-ip; without it every visitor geolocates to this VM.
        proxy_set_header X-Umami-Client-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # --- index.html must always revalidate: a heuristically-cached copy can
    # outlive its hashed bundles after a deploy and white-screen the page.
    # try_files' /index.html fallback internally redirects here, so SPA
    # routes get this too. ---
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # --- the not-found space must never be indexed. One HTTP-200 URL exists
    # per bogus hostname (src/router.ts DomainNotFound / CampaignDomainNotFound),
    # and the SPA's noindex tag only appears after JS runs. This header says it
    # to every crawler, rendered or not, while still letting Google fetch the
    # page and drop the 72 soft 404s it has already indexed — which a
    # robots.txt Disallow would freeze in place instead. Regex location, so it
    # wins over the `/` prefix fallback below. ---
    location ~ /not-found$ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # /index.html as an intermediate argument, not the fallback: try_files
        # internally redirects to its *last* argument, and that redirect leaves
        # this location, taking the X-Robots-Tag with it.
        try_files /index.html =404;
    }

    # --- crawler control files. Named explicitly rather than left to the SPA
    # fallback: without these a deploy that fails to ship sitemap.xml serves
    # the index.html shell at /sitemap.xml with a 200, and Google parses an
    # HTML document as XML instead of seeing a clean 404. ---
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # RFC 9116 canonical path; the file ships at the webroot as /security.txt.
    location = /.well-known/security.txt {
        try_files /security.txt =404;
    }

    # >>> ipv4 drill
    # --- what the drill actually serves, picked by Accept: the helper page for
    # browsers, problem+json for API and CLI clients. Two handlers because the
    # page is a file on disk while the JSON needs $ipv4_outage_until inlined.
    #
    # `alias`, not root + try_files: try_files with a URI argument does an
    # internal redirect, which re-enters location matching and builds the
    # response in some other location — taking these add_headers with it.
    # Both blocks repeat the six security headers for that same reason.
    #
    # ipv4-unavailable.html ships from frontend/public/, so it arrives with the
    # bundle rsync rather than with this file. If it is missing, IPv4 visitors
    # get a 404 instead of the signal.
    #
    # IPv4-Unavailable-Until is omitted on purpose: it is an HTTP-date, and
    # nginx cannot derive the weekday. The exact end time is in the JSON body
    # instead, and Retry-After covers legacy clients. ---
    location = /__ipv4-unavailable-html {
        internal;
        alias /var/www/whynoipv6.com/ipv4-unavailable.html;
        default_type text/html;
        add_header Retry-Over-IPv6 "?1" always;
        add_header Retry-Over-IPv6-Token '"$request_id"' always;
        add_header Retry-After 3600 always;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location = /__ipv4-unavailable-json {
        internal;
        default_type application/problem+json;
        add_header Retry-Over-IPv6 "?1" always;
        add_header Retry-Over-IPv6-Token '"$request_id"' always;
        add_header Retry-After 3600 always;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.whynoipv6.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        return 503 '{"type":"urn:ietf:params:problem:ipv4-unavailable","title":"IPv4 Unavailable","status":503,"detail":"IPv4 unavailable until $ipv4_outage_until; retry over IPv6.","ipv4UnavailableUntil":"$ipv4_outage_until"}';
    }

    # Outside a window the helper page would render "You are on IPv4" to an
    # IPv6 visitor at an indexable URL. It is only ever reached via error_page.
    location = /ipv4-unavailable.html {
        return 404;
    }

    # <<< ipv4 drill
    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name whynoipv6.com www.whynoipv6.com;
    return 301 https://whynoipv6.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.whynoipv6.com;

    ssl_certificate     /etc/ssl/cloudflare/whynoipv6.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/whynoipv6.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://whynoipv6.com$request_uri;
}

; pgBackRest skeleton (09-ops.md §10.1) — host-specific values are Ansible
; vars; secrets in vault. The repo lives OFF-HOST (sftp to a second VM; S3 is
; an equivalent drop-in).
[global]
repo1-type=sftp
repo1-path=/srv/pgbackrest/whynoipv6
repo1-sftp-host={{ backup_host }}
repo1-sftp-host-user=pgbackrest
repo1-sftp-private-key-file=/etc/pgbackrest/id_ed25519
repo1-retention-full=4
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass={{ vault_pgbackrest_cipher_pass }}
compress-type=zst
start-fast=y

[whynoipv6]
pg1-path={{ pg_data_dir }}

# Rotation for the pgBackRest verify version-of-record log (09-ops.md §10.5).
# Install as /etc/logrotate.d/whynoipv6-pgbackrest.
/var/log/pgbackrest/*.log {
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 postgres postgres
    su postgres postgres
}

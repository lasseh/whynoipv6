# Shared Unbound tuning for the two bulk-resolver instances (09-ops.md §8).
server:
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    num-threads: 4
    outgoing-range: 8192
    num-queries-per-thread: 4096
    # NLnet performance guide: reuseport spreads UDP across threads; larger
    # socket buffers absorb spikes without drops.
    so-reuseport: yes
    so-rcvbuf: 4m
    so-sndbuf: 4m
    rrset-cache-size: 512m
    msg-cache-size: 256m
    cache-min-ttl: 0
    cache-max-ttl: 86400
    qname-minimisation: yes
    prefetch: yes
    harden-dnssec-stripped: yes
    auto-trust-anchor-file: "/var/lib/unbound/root.key"   # DNSSEC validation ON
    hide-identity: yes
    hide-version: yes
    verbosity: 1
    statistics-cumulative: no
    extended-statistics: yes
    username: "unbound"
    directory: "/etc/unbound"

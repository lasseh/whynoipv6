# dev-fast profile, Unbound instance 2: prod fan-out (unbound-base.conf
# values) for machines with native netfilter — the dev host exports
# UNBOUND_DEV_PROFILE=dev-fast. Laptops keep the capped dev/ profile
# (OrbStack's 16k UDP conntrack limit).
server:
    directory: "/opt/unbound/etc/unbound"
    interface: 0.0.0.0@53
    # Compose network (docker bridge pools + ULA) and loopback only — never
    # an open resolver, even if the host publish widens.
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: fd00::/8 allow
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    num-threads: 4
    outgoing-range: 8192
    num-queries-per-thread: 4096
    rrset-cache-size: 512m
    msg-cache-size: 256m
    cache-min-ttl: 0
    cache-max-ttl: 86400
    qname-minimisation: yes
    prefetch: yes
    harden-dnssec-stripped: yes
    auto-trust-anchor-file: "var/root.key"   # DNSSEC validation ON
    hide-identity: yes
    hide-version: yes
    verbosity: 1
    statistics-cumulative: no
    extended-statistics: yes
# Certless control open to the (private) compose network so the
# unbound-stats sidecar can scrape `unbound-control stats`. Dev only —
# prod uses localhost control with certs (unbound-base.conf).
remote-control:
    control-enable: yes
    control-interface: 0.0.0.0
    control-interface: ::0
    control-use-cert: no

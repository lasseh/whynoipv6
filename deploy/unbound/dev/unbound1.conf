# Dev-compose Unbound instance 1 — mirrors deploy/unbound/unbound-base.conf
# (09-ops.md §8) with access-control open for the compose network and paths
# adapted to the mvance/unbound image layout.
# Fan-out is capped far below prod: OrbStack's userspace NAT drops UDP flows
# past 16k conntrack entries, which hangs the Docker API under crawl load.
server:
    directory: "/opt/unbound/etc/unbound"
    interface: 0.0.0.0@53
    access-control: 0.0.0.0/0 allow
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    num-threads: 4
    outgoing-range: 256
    num-queries-per-thread: 128
    rrset-cache-size: 512m
    msg-cache-size: 256m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    qname-minimisation: yes
    prefetch: yes
    harden-dnssec-stripped: yes
    auto-trust-anchor-file: "var/root.key"   # DNSSEC validation ON
    hide-identity: yes
    hide-version: yes
    verbosity: 1
    statistics-cumulative: no
    extended-statistics: yes
# Certless control open to the (private) compose network so the
# unbound-stats sidecar can scrape `unbound-control stats`. Dev only —
# prod uses localhost control with certs (unbound-base.conf).
remote-control:
    control-enable: yes
    control-interface: 0.0.0.0
    control-interface: ::0
    control-use-cert: no

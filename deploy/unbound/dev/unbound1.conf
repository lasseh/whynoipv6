# Dev-compose Unbound instance 1 — mirrors deploy/unbound/unbound-base.conf
# (09-ops.md §8) with access-control scoped to the compose network and paths
# adapted to the mvance/unbound image layout.
# Fan-out is capped far below prod, and this profile forwards rather than
# recurses, because OrbStack's userspace NAT leaks a host socket per outbound
# UDP flow (see the forward-zone note at the end of this file).
server:
    directory: "/opt/unbound/etc/unbound"
    interface: 0.0.0.0@53
    # Compose network (docker bridge pools + ULA) and loopback only — never
    # an open resolver, even if the host publish widens.
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: fd00::/8 allow
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    num-threads: 4
    outgoing-range: 256
    num-queries-per-thread: 128
    rrset-cache-size: 512m
    msg-cache-size: 256m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    qname-minimisation: yes
    prefetch: yes
    harden-dnssec-stripped: yes
    auto-trust-anchor-file: "var/root.key"   # DNSSEC validation ON
    hide-identity: yes
    hide-version: yes
    verbosity: 1
    statistics-cumulative: no
    extended-statistics: yes
# Certless control open to the (private) compose network so the
# unbound-stats sidecar can scrape `unbound-control stats`. Dev only —
# prod uses localhost control with certs (unbound-base.conf).
remote-control:
    control-enable: yes
    control-interface: 0.0.0.0
    control-interface: ::0
    control-use-cert: no

# Dev only: forward instead of recursing. Full recursion fans out to thousands
# of distinct authoritative servers, and OrbStack's userspace NAT allocates a
# host socket per outbound flow without reaping them — 27 Aug 2026 this reached
# 6004 leaked sockets with vmgr pinned at ~740% CPU and every container stopped.
# Forwarding collapses the destination set to a handful, which bounds the leak.
# It does not fix it; the reaping bug is OrbStack's.
#
# unbound1 -> Cloudflare, unbound2 -> Google, deliberately different: the
# consensus quorum (backend/internal/consensus) cross-checks the two resolvers,
# so they must not share an upstream view.
#
# Only what unbound *looks up* changes. IPv6 reachability is still measured by
# the crawler's own SafeDialer/dialOverAAAA connections, not by unbound.
# dev-fast/ and unbound-base.conf keep full recursion — prod data is unaffected.
forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 1.0.0.1
    forward-addr: 2606:4700:4700::1111
    forward-addr: 2606:4700:4700::1001

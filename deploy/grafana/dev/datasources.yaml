# Dev-compose Grafana datasource: the stack's Postgres/Timescale. The uid is
# load-bearing — deploy/grafana/alerts.yaml provisions rules against
# `whynoipv6-pg` (09-ops.md §12).
apiVersion: 1
datasources:
  - name: WhyNoIPv6 Postgres
    uid: whynoipv6-pg
    type: postgres
    access: proxy
    url: db:5432
    user: whynoipv6
    secureJsonData:
      password: whynoipv6
    jsonData:
      database: whynoipv6
      sslmode: disable
      timescaledb: true
      # Must stay under whynoipv6_ro's CONNECTION LIMIT 20 (05-schema.md §2.3).
      # Grafana's own default ceiling is far higher, so leaving these unset
      # would let the pool open more connections than the role is allowed and
      # fail with "too many connections for role" the moment §12.2's cutover
      # happens. Pinned before the switch, not after — the cutover is still
      # pending and this is the one prerequisite that has to land first.
      maxOpenConns: 16
      maxIdleConns: 8
      connMaxLifetime: 14400
    isDefault: true
    editable: false

services:
  db:
    image: timescale/timescaledb:latest-pg18
    restart: unless-stopped
    shm_size: 256m   # docker's 64m default breaks parallel queries over the 1M-row domain table
    environment:
      POSTGRES_USER: whynoipv6
      POSTGRES_PASSWORD: whynoipv6
      POSTGRES_DB: whynoipv6
    ports: ["127.0.0.1:15432:5432"]   # 15432: the dev host runs a native postgres on 5432; loopback-only (dev creds)
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whynoipv6"]
      interval: 5s
      timeout: 5s
      retries: 10

  # UNBOUND_DEV_PROFILE picks the config dir: "dev" (default, fan-out capped
  # for OrbStack laptops) or "dev-fast" (prod fan-out; the dev host
  # sets it in .env).
  unbound1:
    image: mvance/unbound:latest
    restart: unless-stopped
    volumes:
      ["./deploy/unbound/${UNBOUND_DEV_PROFILE:-dev}/unbound1.conf:/opt/unbound/etc/unbound/unbound.conf:ro"]
    # Loopback-only: the crawler reaches unbound over the compose network by
    # service name; the host publish exists for the latencyspike probe
    # (backend/internal/consensus/latencyspike), which dials 127.0.0.1.
    ports: ["127.0.0.1:5301:53/udp", "127.0.0.1:5301:53/tcp"]

  unbound2:
    image: mvance/unbound:latest
    restart: unless-stopped
    volumes:
      ["./deploy/unbound/${UNBOUND_DEV_PROFILE:-dev}/unbound2.conf:/opt/unbound/etc/unbound/unbound.conf:ro"]
    ports: ["127.0.0.1:5302:53/udp", "127.0.0.1:5302:53/tcp"]

  migrate:
    build: {context: ./backend, dockerfile: Dockerfile}
    entrypoint: ["/v6ctl", "migrate", "up"]
    environment:
      DATABASE_URL: postgres://whynoipv6:whynoipv6@db:5432/whynoipv6?sslmode=disable
    depends_on:
      db: {condition: service_healthy}

  api:
    build: {context: ./backend, dockerfile: Dockerfile}
    restart: unless-stopped
    entrypoint: ["/api"]
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://whynoipv6:whynoipv6@db:5432/whynoipv6?sslmode=disable
      API_LISTEN: ":8080"                      # dev override: non-loopback so host can reach it
      DATASETS_DIR: /var/lib/whynoipv6/datasets
      # info, not debug: per-request access-log lines are debug-level, and the
      # Taillight shipper's MinLevel follows LOG_LEVEL — debug would ship them.
      LOG_LEVEL: info
      # Dev-only: the prod default (10/h per IP) makes live-check testing
      # impossible from a single machine.
      LIVE_CHECK_RATE_IP_PER_HOUR: "1000"
    volumes: ["datasets:/var/lib/whynoipv6/datasets"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Built bundle served by nginx on :8081 (5173 stays free for local
  # `npm run dev`, which hits the api container via .env.development).
  # VITE_API_URL is baked at build time, so it must be the host-visible origin.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Host-visible API origin baked into the bundle. Laptop default hits the
      # published api port; the dev host sets FRONTEND_API_URL in .env so
      # the bundle targets the nginx-fronted public API. Build args come from
      # interpolation, not env_file — this one must stay a ${...} reference.
      args: {VITE_API_URL: "${FRONTEND_API_URL:-http://localhost:8080}"}
    restart: unless-stopped
    ports: ["8081:80"]
    depends_on: [api]

  # Init container: fetch the IPinfo Lite mmdb into the geoip volume before the
  # crawler starts. Runs as root to write the root-owned volume; the crawler
  # reads it :ro. Set IPINFO_TOKEN in a gitignored .env (free IPinfo token).
  geoip-init:
    build: {context: ./backend, dockerfile: Dockerfile}
    entrypoint: ["/v6ctl", "geoip", "update"]
    user: root
    env_file: [.env]
    environment:
      GEOIP_PATH: /var/lib/GeoIP
    volumes: ["geoip:/var/lib/GeoIP"]

  # Init container: clone/refresh the campaign repo into the campaign volume.
  # The distroless crawler image has no git, so it runs campaign sync with
  # CAMPAIGN_PULL/PUSH=false against this checkout; freshness comes from stack
  # (re)starts. A failed pull keeps the existing clone (offline `up` works).
  campaign-init:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -d /repo/.git ]; then
          git -C /repo pull --ff-only || echo "campaign pull failed; keeping existing checkout"
        else
          git clone --depth 1 https://github.com/lasseh/whynoipv6-campaign.git /repo
        fi
    volumes: ["campaign:/repo"]

  # Init container: seed the dns_provider (ns_host → provider) mapping from the
  # list embedded in v6ctl, so the crawler stamps domain.dns_provider_id from
  # its very first commit instead of leaving the league table empty. Idempotent
  # — re-runs on every `up` and picks up seed edits (06-ingest §6.11).
  provider-init:
    build: {context: ./backend, dockerfile: Dockerfile}
    entrypoint: ["/v6ctl", "provider", "seed"]
    environment:
      DATABASE_URL: postgres://whynoipv6:whynoipv6@db:5432/whynoipv6?sslmode=disable
    depends_on:
      migrate: {condition: service_completed_successfully}

  crawler:
    build: {context: ./backend, dockerfile: Dockerfile}
    restart: unless-stopped
    entrypoint: ["/crawler"]
    # Prod shape is 2 processes (00-overview CRAWLER_PROCS); the dev host
    # sets CRAWLER_REPLICAS=2 in .env, laptops default to 1.
    scale: ${CRAWLER_REPLICAS:-1}
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://whynoipv6:whynoipv6@db:5432/whynoipv6?sslmode=disable
      RESOLVER_BULK_UPSTREAMS: "unbound1:53,unbound2:53"
      # Laptop default 4: full 64-slot fan-out overruns OrbStack's 16k UDP
      # conntrack limit. the dev host sets CRAWLER_WORKER_SLOTS=64 in .env
      # (native netfilter, no such limit).
      WORKER_SLOTS: "${CRAWLER_WORKER_SLOTS:-4}"
      GEOIP_PATH: /var/lib/GeoIP
      # info, not debug: the shipper's MinLevel follows LOG_LEVEL, and the
      # crawler logs per-domain at debug — shipping that floods Taillight.
      LOG_LEVEL: info
      # No git in the distroless image — campaign-init owns clone/refresh.
      CAMPAIGN_PULL: "false"
      CAMPAIGN_PUSH: "false"
    volumes:
      - "geoip:/var/lib/GeoIP:ro"
      - "datasets:/var/lib/whynoipv6/datasets"
      - "campaign:/srv/whynoipv6-campaign:ro"
    depends_on:
      migrate: {condition: service_completed_successfully}
      geoip-init: {condition: service_completed_successfully}
      campaign-init: {condition: service_completed_successfully}
      provider-init: {condition: service_completed_successfully}

  # Scrapes `unbound-control stats` from both resolvers into unbound_stats
  # every 60s (feeds the Grafana panels and keeps alert A5 quiet). The prod
  # convention is a same-host timer; this sidecar maps ports 8953/8954 to the
  # two containers via unbound-control-compose.
  unbound-stats:
    build:
      context: .
      dockerfile: deploy/unbound/dev/stats-scraper.Dockerfile
    restart: unless-stopped
    hostname: unbound-stats
    environment:
      DATABASE_URL: postgres://whynoipv6:whynoipv6@db:5432/whynoipv6?sslmode=disable
      UNBOUND_STATS_CONTROL: /usr/local/bin/unbound-control-compose
    depends_on:
      db: {condition: service_healthy}
      unbound1: {condition: service_started}
      unbound2: {condition: service_started}

  # Dashboards + alert rules A1–A5 provisioned from deploy/grafana (09-ops §12).
  # Loopback-only publish: reach it via ssh -L 3000:localhost:3000 on the server.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "./deploy/grafana/dev/datasources.yaml:/etc/grafana/provisioning/datasources/whynoipv6.yaml:ro"
      - "./deploy/grafana/dev/dashboards.yaml:/etc/grafana/provisioning/dashboards/whynoipv6.yaml:ro"
      - "./deploy/grafana/dev/dashboards:/var/lib/grafana/dashboards:ro"
      - "./deploy/grafana/alerts.yaml:/etc/grafana/provisioning/alerting/whynoipv6.yaml:ro"
      - "grafana:/var/lib/grafana"
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  datasets:
  geoip:
  grafana:
  campaign:

# Docker networks are IPv4-only by default — without this the crawler's v6
# preflight fails with "network is unreachable" even on a v6-enabled host.
# Engine 27+ auto-allocates a ULA subnet and NAT66s outbound via ip6tables.
networks:
  default:
    enable_ipv6: true
